; flake8 cannot read pyproject.toml, so its config lives here.
[flake8]
; black formats to 88; the cap is looser so flake8 doesn't flag long string
; literals and prompt text that black can't split on its own.
max-line-length = 120
; E203/W503 conflict with black's slicing and line-break style.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    chroma_db,
    data
